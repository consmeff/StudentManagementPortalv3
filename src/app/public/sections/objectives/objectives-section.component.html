<div class="pub-shell">
  <h2 class="pub-section-title objectives__heading" appReveal>{{ heading() }}</h2>

  <ul class="objectives__grid">
    @for (objective of objectives(); track objective.id) {
      <li class="objectives__item" appReveal [revealDelay]="$index * 90">
        <div class="objectives__item-head">
          <svg class="objectives__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
            <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8" />
            <circle cx="12" cy="12" r="1.4" fill="currentColor" />
          </svg>
          <h3 class="objectives__title">{{ objective.title }}</h3>
        </div>
        <p class="objectives__body">{{ objective.description }}</p>
      </li>
    }
  </ul>
</div>
