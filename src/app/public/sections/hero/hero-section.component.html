@if (hero(); as content) {
  <div class="pub-shell hero__intro">
    <h1 class="hero__title" appReveal>
      @for (line of content.titleLines; track line) {
        <span class="hero__title-line">{{ line }}</span>
      }
    </h1>

    <p class="hero__subtitle" appReveal [revealDelay]="120">{{ content.subtitle }}</p>

    <a class="pub-btn pub-btn--primary hero__cta" appReveal [revealDelay]="220" [routerLink]="content.ctaRoute">
      {{ content.ctaLabel }}
    </a>
  </div>

  <app-public-image
    class="hero__image"
    appReveal
    [revealDelay]="120"
    [src]="content.imageUrl"
    [alt]="content.imageAlt"
    [eager]="true"
  />
}
