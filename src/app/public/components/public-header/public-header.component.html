<a class="pub-header__skip" href="#main-content">Skip to main content</a>

<div class="pub-shell pub-header__bar">
  <a class="pub-header__brand" routerLink="/" aria-label="College of Nursing Sciences, Muslim Medical Foundation — home">
    <app-public-brand [compact]="true" />
  </a>

  <nav class="pub-header__nav" aria-label="Primary">
    @for (item of navItems; track item.route) {
      <a
        class="pub-header__nav-link"
        [routerLink]="item.route"
        routerLinkActive="is-active"
        #linkActive="routerLinkActive"
        [attr.aria-current]="linkActive.isActive ? 'page' : null"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="pub-header__actions">
    <a class="pub-btn pub-btn--outline pub-header__login" [routerLink]="loginRoute">Login</a>
    <a class="pub-btn pub-btn--primary" [routerLink]="applyRoute">{{ applyLabel }}</a>
  </div>

  <button
    type="button"
    class="pub-header__toggle"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="public-mobile-nav"
    [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
    (click)="toggleMenu()"
  >
    <span class="pi" [class.pi-bars]="!menuOpen()" [class.pi-times]="menuOpen()" aria-hidden="true"></span>
  </button>
</div>

<div id="public-mobile-nav" class="pub-header__panel" [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
  <nav class="pub-shell pub-header__panel-inner" aria-label="Primary (mobile)">
    @for (item of navItems; track item.route) {
      <a
        class="pub-header__panel-link"
        [routerLink]="item.route"
        routerLinkActive="is-active"
        #panelLinkActive="routerLinkActive"
        [attr.aria-current]="panelLinkActive.isActive ? 'page' : null"
      >
        {{ item.label }}
      </a>
    }
    <div class="pub-header__panel-actions">
      <a class="pub-btn pub-btn--outline" [routerLink]="loginRoute">Login</a>
      <a class="pub-btn pub-btn--primary" [routerLink]="applyRoute">{{ applyLabel }}</a>
    </div>
  </nav>
</div>
